[project]
name = "threatnex-ai-ids"
version = "1.0.0"
description = "THREATNEX - AI-Driven Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "pg8000>=1.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
